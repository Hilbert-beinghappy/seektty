# Explicit opt-in experimental provider; select one BrowserUse backend only.
# Mount before creating/resuming a Session. Launches Chromium when an Agent activates.
- insert:
    - id: browser-use
      name: '@deepseek-ai/dsh-browser-use'
    - id: browser-use-provider
      name: '@deepseek-ai/dsh-experimental-browser-use-chrome-devtools-mcp'
      config:
        mode: launch
        headless: true
